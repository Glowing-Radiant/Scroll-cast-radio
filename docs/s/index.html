<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Cast Radio</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #000; color: #fff;
         font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; }
  main { width: 100%; max-width: 560px; margin: 0 auto; padding: 32px 24px; box-sizing: border-box; }
  h1 { font-size: 2.2rem; line-height: 1.15; margin: 0 0 12px; }
  .meta { color: #cfcfcf; margin: 0 0 32px; }
  .btn { display: block; box-sizing: border-box; width: 100%; padding: 16px; margin: 0 0 14px;
         border-radius: 999px; text-align: center; font-weight: 600; font-size: 1.05rem;
         text-decoration: none; border: 2px solid #ffc857; }
  .primary { background: #ffc857; color: #000; }
  .secondary { color: #ffc857; background: transparent; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  audio { width: 100%; margin: 8px 0 20px; }
  .small { color: #9e9e9e; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <p class="small">Scroll Cast Radio</p>
  <h1 id="name">Loading station…</h1>
  <p class="meta" id="meta" aria-live="polite"></p>

  <a class="btn primary" id="open-app" href="#">Open in Scroll Cast Radio</a>
  <div id="player" hidden>
    <audio id="audio" controls preload="none" aria-label="Station stream"></audio>
  </div>
  <a class="btn secondary" id="stream" href="#" hidden>Open stream in another player</a>
  <p class="small">Stations come from Radio Browser, SomaFM, Radio Paradise, laut.fm and lists listeners share.</p>
</main>
<script>
(function () {
  var PACKAGE = "com.scrollcast.radio";
  var MIRRORS = ["de1.api.radio-browser.info", "de2.api.radio-browser.info", "all.api.radio-browser.info"];
  var params = new URLSearchParams(location.search);
  var id = params.get("id") || "";
  var sharedName = params.get("n") || "";
  var sharedStream = params.get("u") || "";
  var source = params.get("source") || "";
  var isWeb = function (url) { return /^https?:\/\//i.test(url); };
  var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
  // Stations from other providers have ids like "somafm:groovesalad"; stations from someone's
  // own source ("user-…") aren't in any directory, so their link carries the name and stream.
  var provider = isUuid ? "radiobrowser"
    : /^user-[0-9a-f]{8}:[0-9a-f]{12}$/.test(id) && isWeb(sharedStream) ? "user"
    : (id.match(/^(somafm|radioparadise|lautfm):[A-Za-z0-9._-]{1,100}$/) || [])[1];
  var localId = id.substring(id.indexOf(":") + 1);
  var isSource = isWeb(source);
  var nameEl = document.getElementById("name");
  var metaEl = document.getElementById("meta");
  var openApp = document.getElementById("open-app");

  if (!provider && !isSource) {
    nameEl.textContent = "This station link isn't valid.";
    openApp.hidden = true;
    return;
  }

  // The app gets the same details the page did: scrollcast://station/<id>?… or scrollcast://source?….
  var appPath = isSource
    ? "source?url=" + encodeURIComponent(source) + "&n=" + encodeURIComponent(sharedName)
    : "station/" + id + (provider === "user"
      ? "?n=" + encodeURIComponent(sharedName) + "&u=" + encodeURIComponent(sharedStream) : "");
  var isAndroid = /android/i.test(navigator.userAgent);
  openApp.href = isAndroid
    ? "intent://" + appPath + "#Intent;scheme=scrollcast;package=" + PACKAGE +
      ";S.browser_fallback_url=" + encodeURIComponent(location.href.split("#")[0] + "#noapp") + ";end"
    : "scrollcast://" + appPath;
  if (!isAndroid) openApp.hidden = true;

  // Try the app straight away on Android, unless we just came back from a failed attempt.
  if (isAndroid && location.hash !== "#noapp") location.href = openApp.href;

  if (isSource) {
    var listName = sharedName || source.replace(/^https?:\/\//, "").split(/[?#]/)[0];
    document.title = listName + " · Scroll Cast Radio";
    nameEl.textContent = listName;
    metaEl.textContent = "A station list for Scroll Cast Radio. Open it in the app to add its stations to your feed.";
    openApp.textContent = "Add to Scroll Cast Radio";
    var list = document.getElementById("stream");
    list.textContent = "Open the list";
    list.href = source;
    list.hidden = false;
    return;
  }

  function getJson(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function fromRadioBrowser(i) {
    if (i >= MIRRORS.length) return Promise.reject(new Error("unreachable"));
    return getJson("https://" + MIRRORS[i] + "/json/stations/byuuid/" + id)
      .then(function (list) {
        var s = list && list[0];
        return s && { name: s.name, place: s.country, tags: (s.tags || "").split(","), stream: s.url_resolved || s.url };
      }, function () { return fromRadioBrowser(i + 1); });
  }

  // Radio Paradise has no station API; these match the app's channel list.
  var PARADISE = {
    "main-mix": ["Radio Paradise Main Mix", "aac-128"],
    "mellow": ["Radio Paradise Mellow Mix", "mellow-128"],
    "rock": ["Radio Paradise Rock Mix", "rock-128"],
    "global": ["Radio Paradise Global Mix", "global-128"],
    "beyond": ["Radio Paradise Beyond", "beyond-128"],
    "serenity": ["Radio Paradise Serenity", "serenity"],
    "kfat": ["KFAT on Radio Paradise", "kfat-128"]
  };

  // Each returns { name, place, tags, stream }, or nothing when the station doesn't exist.
  var LOADERS = {
    radiobrowser: function () { return fromRadioBrowser(0); },
    user: function () {
      return Promise.resolve({ name: sharedName, place: "Shared station", tags: [], stream: sharedStream });
    },
    somafm: function () {
      return getJson("https://api.somafm.com/channels.json").then(function (data) {
        var c = (data.channels || []).filter(function (c) { return c.id === localId; })[0];
        return c && { name: c.title, place: "SomaFM", tags: (c.genre || "").split("|"),
                      stream: "https://ice1.somafm.com/" + c.id + "-128-mp3" };
      });
    },
    radioparadise: function () {
      var c = PARADISE[localId];
      return Promise.resolve(c && { name: c[0], place: "Radio Paradise", tags: [],
                                    stream: "https://stream.radioparadise.com/" + c[1] });
    },
    lautfm: function () {
      return getJson("https://api.laut.fm/station/" + encodeURIComponent(localId)).then(function (s) {
        return s && { name: s.display_name || s.name, place: "laut.fm", tags: s.genres || [], stream: s.stream_url };
      });
    }
  };

  LOADERS[provider]().then(function (s) {
    if (!s || !s.stream) { nameEl.textContent = "Station not found."; return; }
    var name = (s.name || "Unnamed station").trim();
    document.title = name + " · Scroll Cast Radio";
    nameEl.textContent = name;
    metaEl.textContent = [s.place, s.tags.slice(0, 3).join(", ")]
      .filter(Boolean).join(" · ");
    var stream = s.stream;
    var link = document.getElementById("stream");
    link.href = stream;
    link.hidden = false;
    // Browsers block plain-http audio on an https page, so only embed secure streams.
    if (stream.indexOf("https://") === 0) {
      document.getElementById("audio").src = stream;
      document.getElementById("player").hidden = false;
    }
  }).catch(function () {
    nameEl.textContent = "Couldn't load the station right now.";
  });
})();
</script>
</body>
</html>
